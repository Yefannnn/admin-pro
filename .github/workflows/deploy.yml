name: deploy

on:
    push:
        branches: ['matser'] # master 分支有代码提交时触发
        paths-ignore: # 忽略的文件
            - 'README.md'
            - 'LICENSE'
            - 'node_modules/**'
            - 'build/**'
            - 'public/**'

jobs: # 任务
    deploy: # 任务名称
        runs-on: ubuntu-latest # 运行环境  ubuntu-latest windows-latest  macos-latest
        steps:
            #下载源码
            #这一步是将代码仓库的代码下载到 GitHub Actions 的运行环境中，以便后续的构建和部署操作。
            - name: Checkout # 步骤名称
              uses: actions/checkout@v2 # 使用的 action
            #构建
            #这一步是构建项目，比如编译 TypeScript 代码、打包 React 项目等。
            - name: Build
              uses: actions/setup-node@master
              with:
                  node-version: '20.x'
            - run: npm install # 安装依赖
            - run: npm run build # 打包
            #部署
            #这一步是将构建好的项目部署到服务器上。
            - name: Deploy
              uses: peaceiris/actions-gh-pages@v3 # 使用的 action
              with:
                  #部署到 gh-pages 分支
                  branch: gh-pages
                  publish_dir: ./dist # 部署打包后的 dist 目录
                  github_token: ${{ secrets.ADMINPRO }} # GitHub Token
                  user_name: ${{ secrets.MY_USER_NAME }} # GitHub 用户名
                  user_email: ${{ secrets.MY_USER_EMAIL }} # GitHub 邮箱
                  commit_message: 自动部署 # 提交信息
